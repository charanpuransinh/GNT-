openapi: 3.0.3
info:
  title: GNT M19 Production & Monitoring API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /audit/logs:
    get:
      tags: [Audit]
      parameters:
        - { name: companyId, in: query, required: true, schema: { type: string } }
        - { name: module, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        200:
          description: Paginated audit logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AuditLog' } }
                  total: { type: integer }
  /audit/login-history:
    get:
      tags: [Audit]
      parameters:
        - { name: companyId, in: query, required: true, schema: { type: string } }
        - { name: userId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [success, failed] } }
      responses:
        200:
          description: Login history
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LoginHistory' } }
  /health/system:
    get:
      tags: [Health]
      parameters:
        - { name: companyId, in: query, required: true, schema: { type: string } }
      responses:
        200:
          description: System health
          content:
            application/json:
              schema:
                type: object
                properties:
                  overall: { type: string }
                  services: { type: array, items: { $ref: '#/components/schemas/SystemHealth' } }
  /security/events:
    get:
      tags: [Security]
      parameters:
        - { name: companyId, in: query, required: true, schema: { type: string } }
        - { name: severity, in: query, schema: { type: string, enum: [low, medium, high, critical] } }
      responses:
        200:
          description: Security events
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SecurityEvent' } }
  /security/anomaly-check:
    post:
      tags: [Security]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                companyId: { type: string }
                eventType: { type: string }
      responses:
        200:
          description: Anomaly result
          content:
            application/json:
              schema:
                type: object
                properties:
                  anomalyDetected: { type: boolean }
                  events: { type: array }
components:
  schemas:
    AuditLog:
      type: object
      properties:
        id: { type: string }
        companyId: { type: string }
        action: { type: string }
        module: { type: string }
        resource: { type: string }
        createdAt: { type: string, format: date-time }
    LoginHistory:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        ipAddress: { type: string }
        status: { type: string, enum: [success, failed] }
        createdAt: { type: string, format: date-time }
    SecurityEvent:
      type: object
      properties:
        id: { type: string }
        eventType: { type: string }
        severity: { type: string, enum: [low, medium, high, critical] }
        description: { type: string }
        createdAt: { type: string, format: date-time }
    SystemHealth:
      type: object
      properties:
        id: { type: string }
        serviceName: { type: string }
        status: { type: string, enum: [healthy, degraded, unhealthy, down] }
        responseTimeMs: { type: integer }
        lastCheckedAt: { type: string, format: date-time }
