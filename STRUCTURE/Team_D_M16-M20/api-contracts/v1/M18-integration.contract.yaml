openapi: 3.0.3
info:
  title: GNT M18 — External Integration API
  version: 1.0.0
  description: |
    WhatsApp/SMS Gateways, Payment Gateways, GSTN, Webhook monitors.
    Owner: D4-DELTA
  contact:
    name: D4-DELTA Team
servers:
  - url: /api/v1
    description: Base API path

tags:
  - name: Integrations
  - name: Webhooks
  - name: API Keys

paths:
  /integrations:
    get:
      tags: [Integrations]
      summary: List configured gateways
      operationId: listIntegrations
      parameters:
        - name: company_id
          in: query
          schema: { type: string, format: uuid }
        - name: type
          in: query
          schema: { type: string, enum: [sms, whatsapp, payment, gstn, e_invoice, e_way_bill] }
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive, error, pending, degraded] }
        - name: is_active
          in: query
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: Paginated list of integrations
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/IntegrationConfig' } }
                      total: { type: integer }
                      page: { type: integer }
                      limit: { type: integer }

    post:
      tags: [Integrations]
      summary: Add new gateway
      operationId: createIntegration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIntegrationConfig' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/IntegrationConfig' }

  /integrations/{id}:
    get:
      tags: [Integrations]
      summary: Get integration by ID
      operationId: getIntegration
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Integration details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/IntegrationConfig' }

    put:
      tags: [Integrations]
      summary: Update gateway config
      operationId: updateIntegration
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateIntegrationConfig' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/IntegrationConfig' }

    delete:
      tags: [Integrations]
      summary: Remove gateway
      operationId: deleteIntegration
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/IntegrationConfig' }

  /integrations/test:
    post:
      tags: [Integrations]
      summary: Test gateway connection
      operationId: testConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                integration_id: { type: string, format: uuid }
      responses:
        '200':
          description: Test result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/GatewayTestResult' }

  /integrations/status:
    get:
      tags: [Integrations]
      summary: Live status check
      operationId: getGatewayStatus
      parameters:
        - name: company_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: type
          in: query
          schema: { type: string, enum: [sms, whatsapp, payment, gstn, e_invoice, e_way_bill] }
      responses:
        '200':
          description: Gateway status list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/GatewayStatus' }

  /integrations/api-keys:
    post:
      tags: [API Keys]
      summary: Generate API key
      operationId: generateApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateApiKey' }
      responses:
        '201':
          description: API key created (plain_key shown ONLY once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/ApiKeyResponse' }

    get:
      tags: [API Keys]
      summary: List API keys
      operationId: listApiKeys
      parameters:
        - name: company_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ApiKeyResponse' }

  /integrations/api-keys/{id}:
    delete:
      tags: [API Keys]
      summary: Revoke API key
      operationId: revokeApiKey
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }

  /integrations/webhook/{provider}:
    post:
      tags: [Webhooks]
      summary: Receive webhooks
      operationId: receiveWebhook
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Webhook received (always 200 to prevent retries)
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
                  log_id: { type: string }
                  error: { type: string }

components:
  schemas:
    IntegrationConfig:
      type: object
      properties:
        id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        provider: { type: string }
        type: { type: string, enum: [sms, whatsapp, payment, gstn, e_invoice, e_way_bill] }
        config_json: { type: object }
        status: { type: string, enum: [active, inactive, error, pending, degraded] }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateIntegrationConfig:
      type: object
      required: [company_id, provider, type, config_json]
      properties:
        company_id: { type: string, format: uuid }
        provider: { type: string, maxLength: 100 }
        type: { type: string, enum: [sms, whatsapp, payment, gstn, e_invoice, e_way_bill] }
        config_json: { type: object }
        is_active: { type: boolean, default: true }

    UpdateIntegrationConfig:
      type: object
      properties:
        provider: { type: string, maxLength: 100 }
        config_json: { type: object }
        status: { type: string, enum: [active, inactive, error, pending, degraded] }
        is_active: { type: boolean }

    GatewayStatus:
      type: object
      properties:
        type: { type: string }
        provider: { type: string }
        status: { type: string }
        last_checked: { type: string, format: date-time }
        latency_ms: { type: integer }
        message: { type: string }

    GatewayTestResult:
      type: object
      properties:
        success: { type: boolean }
        latency_ms: { type: integer }
        message: { type: string }
        timestamp: { type: string, format: date-time }

    CreateApiKey:
      type: object
      required: [company_id, name, permissions, created_by]
      properties:
        company_id: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        permissions: { type: array, items: { type: string } }
        expires_at: { type: string, format: date-time, nullable: true }
        created_by: { type: string, format: uuid }

    ApiKeyResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        permissions: { type: array, items: { type: string } }
        expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        plain_key: { type: string }
