openapi: 3.0.3
info:
  title: GNT M20 — Trade Document Sub-Contract
  version: "2.0.0"
  description: Trade document generation APIs for BOE, Shipping Bill, and export documents.
servers:
  - url: /api/v1

tags:
  - name: Document-Public
    description: Public document APIs

paths:
  /trade/documents/generate:
    post:
      tags: [Document-Public]
      summary: Generate trade document (public)
      operationId: publicGenerateDocument
      x-consumers: [M08, M10]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentPublicGenerateRequest'
      responses:
        '201':
          description: Generated document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPublicItem'

  /trade/documents/{id}:
    get:
      tags: [Document-Public]
      summary: Get trade document (public)
      operationId: publicGetDocument
      x-consumers: [M10, M11]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPublicItem'

components:
  schemas:
    DocumentPublicGenerateRequest:
      type: object
      required: [trade_job_id, document_type]
      properties:
        trade_job_id:
          type: string
        document_type:
          type: string
          enum: [boe, shipping_bill, commercial_invoice, packing_list, certificate_of_origin]
        metadata:
          type: object

    DocumentPublicItem:
      type: object
      properties:
        id:
          type: string
        trade_job_id:
          type: string
        document_type:
          type: string
        content_json:
          type: object
        generated_at:
          type: string
          format: date-time
        status:
          type: string
        file_url:
          type: string
