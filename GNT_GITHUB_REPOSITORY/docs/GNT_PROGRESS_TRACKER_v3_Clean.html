<!DOCTYPE html>
<html lang="hi" data-theme="gold">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GNT — Progress Tracker | M01–M20</title>
<style>
:root{
  --radius:14px;
  --sidebar-w:260px;
  --font:'Segoe UI',Roboto,'Noto Sans Devanagari',system-ui,sans-serif;
}

/* ===== BACKGROUND: FIXED DARK (Black/Brown family) ===== */
html[data-theme="gold"],
html[data-theme="blue"],
html[data-theme="emerald"],
html[data-theme="crimson"],
html[data-theme="purple"]{
  --bg:#0c0c0e;
  --panel:#161618;
  --panel2:#1e1e21;
  --panel-hover:#252528;
  --border-base:#2a2a2e;
  --text:#f0f0f0;
  --text-secondary:#8a8a90;
  --text-tertiary:#5a5a60;
}

/* ===== BACKGROUND: FIXED LIGHT (White family) ===== */
html[data-theme="light"]{
  --bg:#f2f2f5;
  --panel:#ffffff;
  --panel2:#f7f7fa;
  --panel-hover:#ececf0;
  --border-base:#e0e0e5;
  --text:#1a1a1e;
  --text-secondary:#5a5a60;
  --text-tertiary:#9a9aa0;
}

/* ===== THEME ACCENTS (Border, Active, Badge, Button colors) ===== */
html[data-theme="gold"]{--accent:#d4a017;--accent-soft:#3a2f0d;--accent-glow:rgba(212,160,23,0.18);--accent-ink:#1a1400;}
html[data-theme="blue"]{--accent:#3b82f6;--accent-soft:#0f1f3a;--accent-glow:rgba(59,130,246,0.18);--accent-ink:#ffffff;}
html[data-theme="emerald"]{--accent:#10b981;--accent-soft:#0f3a2b;--accent-glow:rgba(16,185,129,0.18);--accent-ink:#032015;}
html[data-theme="crimson"]{--accent:#ef4444;--accent-soft:#3a1616;--accent-glow:rgba(239,68,68,0.18);--accent-ink:#2a0209;}
html[data-theme="purple"]{--accent:#8b5cf6;--accent-soft:#2b1f4d;--accent-glow:rgba(139,92,246,0.18);--accent-ink:#160b2e;}
html[data-theme="light"]{--accent:#2563eb;--accent-soft:#dbe7fd;--accent-glow:rgba(37,99,235,0.12);--accent-ink:#ffffff;}

/* ===== FIXED STATUS COLORS (Never change) ===== */
:root{
  --st-red:#ef4444;
  --st-red-bg:rgba(239,68,68,0.12);
  --st-orange:#f59e0b;
  --st-orange-bg:rgba(245,158,11,0.12);
  --st-green:#22c55e;
  --st-green-bg:rgba(34,197,94,0.12);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;min-height:100vh;}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:var(--sidebar-w);min-width:var(--sidebar-w);
  background:var(--panel);border-right:1px solid var(--border-base);
  height:100vh;position:sticky;top:0;display:flex;flex-direction:column;
  transition:margin-left .25s ease;
}
.brand{padding:22px 18px;border-bottom:1px solid var(--border-base);}
.brand-row{display:flex;align-items:center;gap:12px;}
.brand-mark{
  width:38px;height:38px;border-radius:10px;
  background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;
}
.brand-name{font-size:18px;font-weight:800;}
.brand-sub{font-size:10px;color:var(--accent);letter-spacing:1.5px;font-weight:700;}
.brand-tag{font-size:11px;color:var(--text-secondary);margin-top:8px;}

.nav{flex:1;overflow-y:auto;padding:8px 12px;}
.nav::-webkit-scrollbar{width:5px;}
.nav::-webkit-scrollbar-thumb{background:var(--border-base);border-radius:5px;}

.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;margin:3px 0;border-radius:10px;
  cursor:pointer;font-size:13px;font-weight:600;color:var(--text-secondary);
  border:1px solid transparent;transition:all .2s ease;
}
.nav-item:hover{background:var(--panel2);color:var(--text);border-color:var(--border-base);}
.nav-item.active{
  background:var(--accent);color:var(--accent-ink);border-color:var(--accent);
  box-shadow:0 4px 20px var(--accent-glow);
}
.nav-item .mnum{
  width:28px;height:24px;border-radius:8px;
  background:var(--panel2);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;color:var(--text);flex-shrink:0;
}
.nav-item.active .mnum{background:var(--accent-ink);color:var(--accent);}
.nav-item .dot-status{
  width:10px;height:10px;border-radius:50%;margin-left:auto;flex-shrink:0;
}

.sidebar-foot{
  padding:14px 18px;border-top:1px solid var(--border-base);
  font-size:11px;color:var(--text-secondary);line-height:1.7;
}

/* ---------- MAIN ---------- */
.main{flex:1;display:flex;flex-direction:column;height:100vh;min-width:0;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 26px;border-bottom:1px solid var(--border-base);
  background:var(--panel);position:sticky;top:0;z-index:5;gap:14px;
}
.burger{
  display:none;background:var(--panel2);border:1px solid var(--border-base);
  color:var(--text);width:36px;height:36px;border-radius:8px;cursor:pointer;
  font-size:16px;transition:all .2s;
}
.burger:hover{border-color:var(--accent);color:var(--accent);}
.page-title{font-size:20px;font-weight:800;}
.crumb{font-size:12px;color:var(--text-secondary);}

/* Theme swatches */
.theme-picker{display:flex;gap:10px;align-items:center;}
.swatch{
  width:24px;height:24px;border-radius:50%;cursor:pointer;
  border:2px solid transparent;transition:all .2s ease;
}
.swatch:hover{transform:scale(1.15);}
.swatch.active{border-color:var(--text);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent);}
.sw-gold{background:#d4a017;}
.sw-blue{background:#3b82f6;}
.sw-emerald{background:#10b981;}
.sw-crimson{background:#ef4444;}
.sw-purple{background:#8b5cf6;}
.sw-light{background:linear-gradient(135deg,#ffffff,#d1d1d1);border:1px solid #ccc;}

/* ---------- CONTENT ---------- */
.content{flex:1;overflow-y:auto;padding:24px 26px 60px 26px;}
.content::-webkit-scrollbar{width:6px;}
.content::-webkit-scrollbar-thumb{background:var(--border-base);border-radius:6px;}

.badge{
  display:inline-block;font-size:11px;font-weight:700;
  padding:4px 12px;border-radius:999px;margin-right:8px;letter-spacing:.3px;
}
.badge-accent{background:var(--accent-soft);color:var(--accent);}
.badge-green{background:var(--st-green-bg);color:var(--st-green);}
.badge-orange{background:var(--st-orange-bg);color:var(--st-orange);}
.badge-red{background:var(--st-red-bg);color:var(--st-red);}

.purpose-line{font-size:13px;color:var(--text-secondary);margin:6px 0 20px 0;}

/* ---------- CATEGORY CARDS ---------- */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:24px;}
.cat-card{
  background:var(--panel);border:1px solid var(--border-base);border-radius:var(--radius);
  padding:20px;position:relative;overflow:hidden;transition:all .25s ease;
}
.cat-card:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,0.2);border-color:var(--accent);}
.cat-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);}

.cat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cat-name{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--text);}
.cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.cat-dot.red{background:var(--st-red);box-shadow:0 0 8px var(--st-red);}
.cat-dot.orange{background:var(--st-orange);box-shadow:0 0 8px var(--st-orange);}
.cat-dot.green{background:var(--st-green);box-shadow:0 0 8px var(--st-green);}

.cat-count{font-size:28px;font-weight:800;color:var(--text);}
.cat-count small{font-size:13px;color:var(--text-secondary);font-weight:600;}
.cat-bar{height:6px;border-radius:6px;background:var(--panel2);margin-top:14px;overflow:hidden;}
.cat-bar-fill{height:100%;border-radius:6px;transition:width .6s ease;}
.cat-bar-fill.red{background:var(--st-red);}
.cat-bar-fill.orange{background:var(--st-orange);}
.cat-bar-fill.green{background:var(--st-green);}
.cat-label{font-size:11.5px;color:var(--text-secondary);margin-top:10px;font-weight:500;}

/* ---------- STATUS STACK ---------- */
.status-stack{display:flex;flex-direction:column;gap:12px;max-width:360px;}
.status-box{
  display:flex;align-items:center;gap:14px;
  padding:14px 18px;border-radius:12px;border:1px solid var(--border-base);
  background:var(--panel2);opacity:.35;transition:all .3s ease;
}
.status-box.live{opacity:1;transform:scale(1.01);}
.status-box .sicon{
  width:34px;height:34px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;flex-shrink:0;font-weight:800;
}
.status-box.st-complete .sicon{background:var(--st-green-bg);color:var(--st-green);}
.status-box.st-progress .sicon{background:var(--st-orange-bg);color:var(--st-orange);}
.status-box.st-none .sicon{background:var(--st-red-bg);color:var(--st-red);}
.status-box b{font-size:14px;}
.status-box span.pct{margin-left:auto;font-size:13px;font-weight:700;}

.status-box.st-complete.live{border-color:var(--st-green);box-shadow:0 0 20px rgba(34,197,94,0.15);}
.status-box.st-progress.live{border-color:var(--st-orange);box-shadow:0 0 20px rgba(245,158,11,0.15);}
.status-box.st-none.live{border-color:var(--st-red);box-shadow:0 0 20px rgba(239,68,68,0.15);}

/* ---------- SECTIONS ---------- */
.section{
  background:var(--panel);border:1px solid var(--border-base);border-radius:var(--radius);
  padding:20px 22px;margin-bottom:20px;
}
.section:hover{border-color:var(--accent);}
.section h3{margin:0 0 14px 0;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;}

/* ---------- OVERVIEW TABLE ---------- */
.ov-table{width:100%;border-collapse:collapse;font-size:13px;}
.ov-table th{
  text-align:left;color:var(--text-secondary);font-weight:700;
  padding:10px 12px;border-bottom:2px solid var(--border-base);font-size:11.5px;letter-spacing:.5px;
}
.ov-table td{padding:11px 12px;border-bottom:1px solid var(--border-base);transition:background .15s;}
.ov-table tr:hover{background:var(--panel-hover);cursor:pointer;}

.ov-dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
.ov-pctbar{
  width:90px;height:6px;background:var(--panel2);border-radius:6px;
  overflow:hidden;display:inline-block;vertical-align:middle;
}
.ov-pctbar div{height:100%;border-radius:6px;}
.pbar-red{background:var(--st-red);}
.pbar-orange{background:var(--st-orange);}
.pbar-green{background:var(--st-green);}

/* ---------- BUTTONS ---------- */
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0;}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 18px;border-radius:10px;font-size:12.5px;font-weight:700;
  border:1px solid transparent;cursor:pointer;transition:all .2s ease;
  font-family:inherit;
}
.btn:hover{transform:translateY(-1px);}
.btn-accent{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 15px var(--accent-glow);}
.btn-accent:hover{box-shadow:0 6px 25px var(--accent-glow);}
.btn-green{background:var(--st-green);color:#fff;}
.btn-orange{background:var(--st-orange);color:#1a1a00;}
.btn-red{background:var(--st-red);color:#fff;}
.btn-ghost{background:transparent;border-color:var(--border-base);color:var(--text-secondary);}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}

/* ---------- NOTE ---------- */
.note{
  font-size:12px;color:var(--text-secondary);
  background:var(--panel2);border:1px dashed var(--border-base);
  border-radius:10px;padding:14px 16px;margin-bottom:20px;line-height:1.6;
}

/* ---------- OVERLAY ---------- */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:15;backdrop-filter:blur(2px);}
.overlay.show{display:block;}

/* ---------- RESPONSIVE ---------- */
@media(max-width:880px){
  .sidebar{position:fixed;left:0;top:0;z-index:20;margin-left:calc(-1 * var(--sidebar-w));box-shadow:0 0 40px rgba(0,0,0,.5);}
  .sidebar.open{margin-left:0;}
  .burger{display:inline-flex;align-items:center;justify-content:center;}
  .page-title{font-size:17px;}
  .cat-grid{grid-template-columns:1fr;}
}
@media(max-width:600px){
  .content{padding:16px;}
  .topbar{padding:12px 16px;}
  .ov-table{font-size:11.5px;}
  .ov-table th,.ov-table td{padding:8px 6px;}
}
</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="toggleSidebar(false)"></div>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="brand-row">
      <div class="brand-mark">GNT</div>
      <div>
        <div class="brand-name">GNT Tracker</div>
        <div class="brand-sub">GARUDA NEXTECH</div>
      </div>
    </div>
    <div class="brand-tag">Module-wise build progress</div>
  </div>
  <nav class="nav" id="navList"></nav>
  <div class="sidebar-foot">
    <span style="color:var(--st-red)">●</span> Not Started &nbsp;
    <span style="color:var(--st-orange)">●</span> In Progress &nbsp;
    <span style="color:var(--st-green)">●</span> Complete
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="burger" onclick="toggleSidebar()">☰</button>
      <div>
        <div class="crumb" id="crumb">GNT / Overview</div>
        <div class="page-title" id="pageTitle">Overview — All Modules</div>
      </div>
    </div>
    <div class="theme-picker">
      <div class="swatch sw-gold active" data-t="gold" onclick="setTheme('gold')" title="Gold"></div>
      <div class="swatch sw-blue" data-t="blue" onclick="setTheme('blue')" title="Blue"></div>
      <div class="swatch sw-emerald" data-t="emerald" onclick="setTheme('emerald')" title="Emerald"></div>
      <div class="swatch sw-crimson" data-t="crimson" onclick="setTheme('crimson')" title="Crimson"></div>
      <div class="swatch sw-purple" data-t="purple" onclick="setTheme('purple')" title="Purple"></div>
      <div class="swatch sw-light" data-t="light" onclick="setTheme('light')" title="Light"></div>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<script>
const MODULES = [
  {id:'M01',name:'Foundation',purpose:'System base, app shell, global configuration',
    target:{frontend:12,backend:10,api:4,tests:8}, built:{frontend:0,backend:0,api:0,tests:0}},
  {id:'M02',name:'Core Architecture',purpose:'User, Role, Permission, Authentication, Authorization',
    target:{frontend:14,backend:18,api:6,tests:12}, built:{frontend:0,backend:0,api:0,tests:0}},
  {id:'M03',name:'Device & Platform',purpose:'Device registration, sessions, app updates, deployment',
    target:{frontend:10,backend:8,api:4,tests:6}, built:{frontend:0,backend:0,api:0,tests:0}},
  {id:'M04',name:'Company Management',purpose:'Company profile, branches, financial year, system settings',
    target:{frontend:18,backend:16,api:5,tests:10}, built:{frontend:0,backend:0,api:0,tests:0}},
  {id:'M05',name:'Party Management',purpose:'Customer & Supplier master, outstanding, aging, ledger view',
    target:{frontend:16,backend:14,api:5,tests:10}, built:{frontend:0,backend:0,api:0,tests:0}},
  {id:'M06',name:'Inventory Management',purpose:'Product, Category, Stock, Batch, Serial, Transfer, Adjustment',
    target:{frontend:24,backend:22,api:6,tests:14}, built:{frontend:0,backend:0,api:0,tests:0}},
  {id:'M07',name:'Purchase Management',purpose:'Purchase Order, Purchase Invoice, GRN, Return, Payment',
    target:{frontend:20,backend:18,api:6,tests:12}, built:{frontend:0,backend:0,api:0,tests:0}},
  {id:'M08',name:'Sales & Billing',purpose:'Quotation, Sales Order, Invoice, Return, Receipt, Print/Share',
    target:{frontend:28,backend:24,api:8,tests:16}, built:{frontend:0,backend:0,api:0,tests:0}},
  {id:'M09',name:'GST & Compliance',purpose:'GST Config, Tax Calculation, Returns, E-Invoice, E-Way Bill',
    target:{frontend:18,backend:16,api:5,tests:10}, built:{frontend:0,backend:0,api:0,tests:0}},
  {id:'M10',name:'Accounting',purpose:'Ledger, Cash/Bank Book, Journal Voucher, BRS, Final Accounts',
    target:{frontend:22,backend:20,api:6,tests:14}, built:{frontend:0,backend:0,api:0,tests:0}},
  {id:'M11',name:'Payment & Communication',purpose:'Payment Entry, Receipt, Due Tracking, WhatsApp/SMS/Email',
    target:{frontend:16,backend:14,api:5,tests:10}, built:{frontend:0,backend:0,api:0,tests:0}},
  {id:'M12',name:'Employee & HR',purpose:'Employee Master, Attendance, Leave, Salary, Advance',
    target:{frontend:18,backend:16,api:5,tests:10}, built:{frontend:0,backend:0,api:0,tests:0}},
  {id:'M13',name:'Smart Automation',purpose:'Scheduled tasks, Payment reminders, Stock alerts, Compliance alerts',
    target:{frontend:12,backend:14,api:4,tests:8}, built:{frontend:0,backend:0,api:0,tests:0}},
  {id:'M14',name:'Import & Export',purpose:'Excel/CSV Import, Validation, Export, History Logs',
    target:{frontend:10,backend:10,api:4,tests:6}, built:{frontend:0,backend:0,api:0,tests:0}},
  {id:'M15',name:'Data Storage & Sync',purpose:'Sync Monitor, Backup Engine, Restore, Conflict Resolution',
    target:{frontend:10,backend:12,api:4,tests:6}, built:{frontend:0,backend:0,api:0,tests:0}},
  {id:'M16',name:'Notification Engine',purpose:'In-App, WhatsApp, SMS, Email notifications + delivery tracking',
    target:{frontend:8,backend:12,api:3,tests:6}, built:{frontend:0,backend:0,api:0,tests:0}},
  {id:'M17',name:'Reporting',purpose:'Sales, Purchase, Inventory, GST, Accounting, HR reports',
    target:{frontend:14,backend:16,api:4,tests:8}, built:{frontend:0,backend:0,api:0,tests:0}},
  {id:'M18',name:'External Integration',purpose:'WhatsApp/SMS Gateways, Payment Gateways, GSTN, Webhook monitors',
    target:{frontend:10,backend:12,api:4,tests:6}, built:{frontend:0,backend:0,api:0,tests:0}},
  {id:'M19',name:'Production & Monitoring',purpose:'Activity logs, Login history, Permission tracker, System health',
    target:{frontend:10,backend:12,api:4,tests:6}, built:{frontend:0,backend:0,api:0,tests:0}},
  {id:'M20',name:'International Trade & HSN',purpose:'8-digit HSN engine, Export/Import shipments, Customs, FX, Trade docs',
    target:{frontend:14,backend:16,api:6,tests:10}, built:{frontend:0,backend:0,api:0,tests:0}},
];

const CAT_LABELS = {frontend:'Frontend Files',backend:'Backend Files',api:'API / Contract Files',tests:'Test Files'};
const CAT_STATUS = {frontend:'orange',backend:'orange',api:'orange',tests:'orange'};

function pct(built,target){return target>0?Math.min(100,Math.round((built/target)*100)):0;}
function statusOf(p){if(p<=0)return 'red';if(p>=100)return 'green';return 'orange';}
function moduleOverallPct(m){
  const cats=['frontend','backend','api','tests'];let sumT=0,sumB=0;
  cats.forEach(c=>{sumT+=m.target[c];sumB+=m.built[c];});
  return pct(sumB,sumT);
}
function moduleOverallStatus(m){return statusOf(moduleOverallPct(m));}
function statusColorVar(s){return s==='red'?'var(--st-red)':s==='orange'?'var(--st-orange)':'var(--st-green)';}

/* sidebar */
function buildNav(){
  let html=`<div class="nav-item active" data-id="overview" onclick="selectView('overview')"><span class="mnum">≡</span><span>Overview</span></div>`;
  html+=MODULES.map(m=>{
    const s=moduleOverallStatus(m);
    return `<div class="nav-item" data-id="${m.id}" onclick="selectView('${m.id}')"><span class="mnum">${m.id.replace('M','')}</span><span>${m.name}</span><span class="dot-status" style="background:${statusColorVar(s)}"></span></div>`;
  }).join('');
  document.getElementById('navList').innerHTML=html;
}

/* module detail */
function renderModulePage(m){
  const cats=['frontend','backend','api','tests'];
  const catCards=cats.map(c=>{
    const b=m.built[c],t=m.target[c],p=pct(b,t),s=statusOf(p);
    return `<div class="cat-card"><div class="cat-head"><div class="cat-name">${CAT_LABELS[c]}</div><div class="cat-dot ${s}"></div></div><div class="cat-count">${b}<small> / ${t} files</small></div><div class="cat-bar"><div class="cat-bar-fill ${s}" style="width:${p}%"></div></div><div class="cat-label">${p}% built · ${s==='green'?'Complete':s==='orange'?'In Progress':'Not Started'}</div></div>`;
  }).join('');

  const overallP=moduleOverallPct(m),overallS=moduleOverallStatus(m);
  const boxes=[['st-complete','✓','Complete','green'],['st-progress','⋯','In Progress','orange'],['st-none','✕','Not Started','red']];
  const stack=boxes.map(b=>{
    const isLive=b[3]===overallS;
    return `<div class="status-box ${b[0]} ${isLive?'live':''}"><div class="sicon">${b[2]}</div><b>${b[2]}</b>${isLive?`<span class="pct" style="color:${statusColorVar(b[3])}">${overallP}%</span>`:''}</div>`;
  }).join('');

  return `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;"><span class="badge badge-accent">${m.id}</span><span class="badge badge-${overallS}">${overallS==='green'?'● Complete':overallS==='orange'?'● In Progress':'● Not Started'}</span></div><div class="purpose-line">${m.purpose}</div><div class="btn-row"><button class="btn btn-accent">✓ Mark Complete</button><button class="btn btn-orange">⋯ In Progress</button><button class="btn btn-red">✕ Reset</button><button class="btn btn-ghost">📋 Details</button></div><div class="cat-grid">${catCards}</div><div class="section"><h3>Overall Status</h3><div class="status-stack">${stack}</div></div><div class="note">ℹ यह डेटा अभी सिर्फ ब्लूप्रिंट के target नंबर दिखा रहा है — असली फाइल गिनती 0 है। जब प्रोजेक्ट फाइल अपलोड होगी, यह auto-update होगा।</div>`;
}

/* overview */
function renderOverview(){
  const tc=MODULES.filter(m=>moduleOverallStatus(m)==='green').length;
  const tp=MODULES.filter(m=>moduleOverallStatus(m)==='orange').length;
  const tn=MODULES.filter(m=>moduleOverallStatus(m)==='red').length;
  const rows=MODULES.map(m=>{
    const p=moduleOverallPct(m),s=moduleOverallStatus(m);
    return `<tr onclick="selectView('${m.id}')"><td><b style="color:${statusColorVar(s)}">${m.id}</b></td><td>${m.name}</td><td>${m.built.frontend}/${m.target.frontend}</td><td>${m.built.backend}/${m.target.backend}</td><td>${m.built.api}/${m.target.api}</td><td>${m.built.tests}/${m.target.tests}</td><td><span class="ov-pctbar"><div class="pbar-${s}" style="width:${p}%"></div></span> <b style="color:${statusColorVar(s)}">${p}%</b></td><td><span class="ov-dot" style="background:${statusColorVar(s)}"></span></td></tr>`;
  }).join('');

  return `<div class="cat-grid" style="margin-bottom:24px;"><div class="cat-card"><div class="cat-head"><div class="cat-name">🟢 Complete</div><div class="cat-dot green"></div></div><div class="cat-count">${tc}<small> / 20</small></div></div><div class="cat-card"><div class="cat-head"><div class="cat-name">🟠 In Progress</div><div class="cat-dot orange"></div></div><div class="cat-count">${tp}<small> / 20</small></div></div><div class="cat-card"><div class="cat-head"><div class="cat-name">🔴 Not Started</div><div class="cat-dot red"></div></div><div class="cat-count">${tn}<small> / 20</small></div></div><div class="cat-card"><div class="cat-head"><div class="cat-name">📁 Total Files</div><div class="cat-dot" style="background:var(--accent);box-shadow:0 0 8px var(--accent)"></div></div><div class="cat-count">914<small> target</small></div></div></div><div class="btn-row"><button class="btn btn-accent">📊 Export</button><button class="btn btn-ghost">🔄 Refresh</button></div><div class="section"><h3>All Modules — M01 to M20</h3><div style="overflow-x:auto;"><table class="ov-table"><thead><tr><th>ID</th><th>Module</th><th>FE</th><th>BE</th><th>API</th><th>Tests</th><th>Progress</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div><div class="note">💡 किसी भी मॉड्यूल की row पर क्लिक करके detail देखें। Theme बदलने से सिर्फ border, badge और active color बदलेगा — background हमेशा neutral रहेगा।</div>`;
}

/* interactions */
function selectView(id){
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.id===id));
  if(id==='overview'){
    document.getElementById('pageTitle').textContent='Overview — All Modules';
    document.getElementById('crumb').textContent='GNT / Overview';
    document.getElementById('content').innerHTML=renderOverview();
  }else{
    const m=MODULES.find(x=>x.id===id);
    document.getElementById('pageTitle').textContent=m.id+' — '+m.name;
    document.getElementById('crumb').textContent='GNT / '+m.id;
    document.getElementById('content').innerHTML=renderModulePage(m);
  }
  if(window.innerWidth<=880)toggleSidebar(false);
  document.getElementById('content').scrollTop=0;
}
function setTheme(name){
  document.documentElement.setAttribute('data-theme',name);
  document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('active',s.dataset.t===name));
}
function toggleSidebar(force){
  const sb=document.getElementById('sidebar'),ov=document.getElementById('overlay');
  const open=force!==undefined?force:!sb.classList.contains('open');
  sb.classList.toggle('open',open);ov.classList.toggle('show',open);
}

buildNav();
selectView('overview');
</script>
</body>
</html>
