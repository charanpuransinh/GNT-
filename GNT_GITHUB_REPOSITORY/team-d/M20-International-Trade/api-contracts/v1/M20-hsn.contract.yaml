openapi: 3.0.3
info:
  title: GNT M20 — HSN Sub-Contract
  version: "2.0.0"
  description: HSN-specific API contract for cross-module consumption (M06, M07, M08, M09).
servers:
  - url: /api/v1

tags:
  - name: HSN-Public
    description: Public HSN APIs consumed by other modules

paths:
  /hsn/search:
    get:
      tags: [HSN-Public]
      summary: Public HSN search
      operationId: publicSearchHSN
      x-consumers: [M06, M07, M08, M09]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: HSN items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HSNPublicItem'

  /hsn/validate:
    post:
      tags: [HSN-Public]
      summary: Validate HSN for GST compliance
      operationId: publicValidateHSN
      x-consumers: [M09]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HSNPublicValidateRequest'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HSNPublicValidateResponse'

  /hsn/{code}/details:
    get:
      tags: [HSN-Public]
      summary: Get HSN details for product/invoice lookup
      operationId: publicGetHSNDetails
      x-consumers: [M06, M08]
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: HSN details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HSNPublicItem'

components:
  schemas:
    HSNPublicItem:
      type: object
      properties:
        code:
          type: string
        description:
          type: string
        chapter:
          type: string
        heading:
          type: string
        subheading:
          type: string
        tariff_item:
          type: string
        gst_rate:
          type: number
        igst_rate:
          type: number
        cess_rate:
          type: number

    HSNPublicValidateRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
        product_description:
          type: string

    HSNPublicValidateResponse:
      type: object
      properties:
        valid:
          type: boolean
        code:
          type: string
        gst_rate:
          type: number
        igst_rate:
          type: number
        message:
          type: string
