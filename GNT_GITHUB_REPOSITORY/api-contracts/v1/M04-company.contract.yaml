openapi: 3.0.3
info:
  title: GNT M04 Company Management API
  version: "1.1.0"
  description: >
    Public contract for M04 Company Management (टास्क #024 — B4: असली code से मिलाया गया)।
    कंपनी की पहचान सिर्फ़ login के token से (tenant-middleware) — x-company-id header पर
    भरोसा नहीं (टास्क #009), इसलिए पुराना XCompanyId parameter हटा दिया गया है।
    सारे जवाब एक जैसे envelope में: { success, data?/message?, meta? }।
servers:
  - url: /api/v1/company
tags:
  - name: Profile
  - name: Branches
  - name: Financial Year
  - name: Roles
  - name: Users
paths:
  /profile:
    get:
      tags: [Profile]
      summary: कंपनी का profile
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Profile (data में कंपनी, meta.requestId सहित)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeWithMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Profile]
      summary: Profile बदलो
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyProfileUpdate" }
      responses:
        "200": { description: बदला गया }
        "400": { description: validation गलती }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /branches:
    get:
      tags: [Branches]
      summary: शाखाओं की सूची
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: सूची (data: Branch[]) }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Branches]
      summary: नई शाखा
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchCreate" }
      responses:
        "201": { description: बन गई (data: Branch) }
        "400": { description: validation गलती }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /branches/{branchId}:
    delete:
      tags: [Branches]
      summary: शाखा हटाओ
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: branchId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: हट गई (message) }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /financial-years:
    get:
      tags: [Financial Year]
      summary: financial year की सूची
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: सूची (data: FinancialYear[]) }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Financial Year]
      summary: नया financial year (एक कंपनी के FY आपस में overlap नहीं कर सकते — DB EXCLUDE)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinancialYearCreate" }
      responses:
        "201": { description: बना (data: FinancialYear) }
        "400": { description: validation गलती }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /financial-years/{fyId}/switch:
    post:
      tags: [Financial Year]
      summary: active FY बदलो
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: fyId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: बदला (message) }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /roles:
    get:
      tags: [Roles]
      summary: भूमिकाओं की सूची (permissions nested सहित)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: सूची (data: Role[]) }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /roles/{roleId}/permissions:
    put:
      tags: [Roles]
      summary: भूमिका की permissions बदलो (पूरी तरह replace — deleteMany + create)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: roleId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RolePermissionsUpdate" }
      responses:
        "200": { description: बदलीं (message) }
        "400": { description: validation गलती }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /users:
    get:
      tags: [Users]
      summary: उपयोगकर्ताओं की सूची
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: सूची (data: User[]) }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Users]
      summary: नया उपयोगकर्ता
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201": { description: बना (data: User) }
        "400": { description: validation गलती }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /users/{userId}/toggle:
    post:
      tags: [Users]
      summary: उपयोगकर्ता चालू/बंद करो
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: बदला (message) }
        "401": { $ref: "#/components/responses/Unauthorized" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: token गायब/गलत — tenant की पहचान token से ही बनती है
  schemas:
    Envelope:
      type: object
      properties:
        success: { type: boolean }
        data: {}
        message: { type: string }
        meta:
          type: object
          properties:
            requestId: { type: string }
            total: { type: integer }
            page: { type: integer }
            limit: { type: integer }
    EnvelopeWithMeta:
      type: object
      properties:
        success: { type: boolean }
        data: {}
        meta:
          type: object
          properties:
            requestId: { type: string }
    CompanyProfileUpdate:
      type: object
      properties:
        name: { type: string }
        gstin: { type: string }
        address: { type: string }
        phone: { type: string }
        email: { type: string }
        logo_url: { type: string }
        primary_color: { type: string }
    BranchCreate:
      type: object
      properties:
        name: { type: string }
        address: { type: string }
        phone: { type: string }
        email: { type: string }
        is_active: { type: boolean }
    FinancialYearCreate:
      type: object
      properties:
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        prefix: { type: string }
        is_active: { type: boolean }
    RolePermissionsUpdate:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items: { type: string, format: uuid }
    UserCreate:
      type: object
      properties:
        username: { type: string }
        password: { type: string }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        role_ids:
          type: array
          items: { type: string, format: uuid }
