# SonarCloud — compatible with Automatic Analysis (the mode this project uses:
# no CI-based sonar-scanner step exists in any workflow).
#
# Automatic Analysis reads ONLY a small allow-list of keys from this file
# (project identity, encoding, exclusions). It does NOT accept `sonar.sources`
# or `sonar.*.reportPaths` — and the old `sonar.sources=STRUCTURE` here pointed
# at a directory that was deleted (commit b41d50d), which is why every analysis
# failed with a path error. Those keys are removed; Automatic Analysis discovers
# sources on its own.
sonar.projectKey=charanpuransinh_GNT-
sonar.organization=charanpuransinh
sonar.projectName=GARUDA NEXTECH
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.md,**/*.lock.json,**/package-lock.json
