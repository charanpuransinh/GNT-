language: "en"
reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    enabled: true
    base_branches:
      - "main"
  path_filters:
    - "STRUCTURE/**"
    - "!**/node_modules/**"
    - "!**/*.md"
    - "!**/*.lock.json"
chat:
  auto_reply: true
